# ~/.config/mpv/mpv.conf
# Hyprland theme: Graphite black with the wallpaper accent.
# The accent lines below (osd-selected-color and the osc/console/stats
# *_color lines that carry the accent) are REWRITTEN by
# ~/.config/hypr/scripts/sync_border.py on each accent change, matched by key.
# New mpv instances pick them up; running ones keep their colours.

# Main mpv options
background-color='#111111'
osd-back-color='#1c1c1c'
osd-border-color='#0a0a0a'
osd-color='#e5e5e5'
osd-shadow-color='#0a0a0a'
# Highlighted entry in the playlist/track/chapter menus.
osd-selected-color='#ba83e0'
osd-selected-outline-color='#0a0a0a'

# On-screen controller. timecode_color is the progress bar and the time.
script-opts-append='osc-background_color=#111111'
script-opts-append='osc-timecode_color=#ba83e0'
script-opts-append='osc-held_element_color=#d5b4ec'
script-opts-append='osc-time_pos_outline_color=#0a0a0a'

# Console and its menus: the focused row is an accent fill with on-accent
# text, as in GTK, Qt and kitty; typed matches use the companion colour.
script-opts-append='console-focused_back_color=#ba83e0'
script-opts-append='console-focused_color=#111111'
script-opts-append='console-match_color=#e083a9'

# Stats script options (Press '?' to show)
# Colors are in BBGGRR format (no '#'): the accent is written byte-swapped.
script-opts-append=stats-border_color=0a0a0a
script-opts-append=stats-font_color=e5e5e5
script-opts-append=stats-plot_bg_border_color=e5e5e5
script-opts-append=stats-plot_bg_color=1c1c1c
script-opts-append=stats-plot_color=e083ba
