general {
    lock_cmd         = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = hyprlock                          # Lock immediately before suspend
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'          # Wake display without double keypress
}

# 10 minutes → turn off display (saves power while unlocked)
listener {
    timeout   = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 minutes → lock screen
listener {
    timeout   = 900
    on-timeout = ~/.config/scripts/keycheck.sh && faillock --reset && hyprlock
}

# 45 minutes → suspend the system
listener {
    timeout   = 2700
    on-timeout = systemctl suspend
}
