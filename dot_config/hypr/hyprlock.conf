# Hyprlock — HyprBlur Theme
# Ported from old catppuccin config with monochrome color palette
# See: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

# ▓▒░ HYPRBLUR COLOR PALETTE
$base     = rgb(111111)
$mantle   = rgb(1c1c1c)
$surface0 = rgb(2d2d2d)
$text     = rgb(e5e5e5)
$subtext  = rgb(888888)
$accent   = rgb(e5e5e5)
$red      = rgb(d75f5f)
$green    = rgb(a3be8c)

# Hex-only variants for Pango markup (no 0x prefix)
$textAlpha   = e5e5e5
$accentAlpha = e5e5e5

$font = CaskaydiaCove Nerd Font Italic

# ▓▒░ GENERAL
# NOTE: no_fade_in, grace, and disable_loading_bar were removed upstream.
#       Grace period is now passed as the --grace CLI flag (see hypridle.conf).
general {
    hide_cursor = true
}

# ▓▒░ BACKGROUND — transparent background with Hyprland session blur
background {
    monitor     =
    color       = rgba(0,0,0,0)
    blur_passes = 0
}

# ▓▒░ CLOCK — large time display at top
label {
    monitor     =
    text        = $TIME
    color       = $text
    font_size   = 90
    font_family = $font
    position    = 0, -400
    halign      = center
    valign      = top
}

# ▓▒░ DATE — below the clock
label {
    monitor     =
    text        = cmd[update:43200000] date +"%A, %d %B %Y"
    color       = $text
    font_size   = 25
    font_family = $font
    position    = 0, -350
    halign      = center
    valign      = top
}

# ▓▒░ KEYBOARD LAYOUT INDICATOR
label {
    monitor     =
    text        = Layout: $LAYOUT
    color       = $subtext
    font_size   = 18
    font_family = $font
    position    = 0, -300
    halign      = center
    valign      = top
}

# ▓▒░ PASSWORD INPUT FIELD
input-field {
    monitor          =
    size             = 300, 60
    outline_thickness = 4
    dots_size        = 0.2
    dots_spacing     = 0.2
    dots_center      = true
    outer_color      = $accent
    inner_color      = $surface0
    font_color       = $text
    fade_on_empty    = true
    placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">عَبْدُالرَّحْمٰنِ</span></span>
    hide_input       = false
    check_color      = $accent
    fail_color       = $red
    fail_text        = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color   = $green
    position         = 0, -120
    halign           = center
    valign           = center
}
