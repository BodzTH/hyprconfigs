[General]
####################################################################
# General & Screen Settings
####################################################################

# Set this to your exact monitor resolution to help SDDM render faster.
ScreenWidth="1920"
ScreenHeight="1080"

# Adds a border around the entire screen (0 means it fills the whole monitor).
ScreenPadding="0"

# Rounds the corners of the login box, input fields, and buttons.
RoundCorners="20"

# The font used for all text. Must be installed on your system.
Font="CaskaydiaCove Nerd Font"
FontSize="12"

# Locale settings for how the date and time are formatted.
Locale=""
HourFormat="hh:mm A"
DateFormat="dddd, d of MMMM"

# The text displayed at the very top of the login box.
HeaderText="عَبْدُالرَّحْمٰنِ"

####################################################################
# Background (Video/Image) Settings
####################################################################

# A static image shown for a split second while the video loads.
BackgroundPlaceholder="Backgrounds/black_bg.jpg"

# The main background video (B&W variant).
Background="Backgrounds/street.gif"
BackgroundS="Backgrounds/street.gif"

# Playback speed for the video (1.0 is normal speed).
BackgroundSpeed="1.0"
PauseBackground="false"

# Darkens the background. 0.0 is original brightness, 1.0 is pitch black.
DimBackground="0.0"
DimBackgroundImage="0.0"

# How the background fits the screen (Crop=true fills the screen, false leaves black bars).
CropBackground="true"
ScaleImageCropped="true"

# Alignment of the background if it is larger than your screen.
BackgroundHorizontalAlignment="center"
BackgroundVerticalAlignment="center"
BackgroundImageHAlignment="center"
BackgroundImageVAlignment="center"


####################################################################
# Color Palette (HyprBlur - Black & White Theme)
####################################################################

# --- Base Text Colors ---
HeaderTextColor="#ffffff"
DateTextColor="#ffffff"
TimeTextColor="#ffffff"
MainColor="#ffffff"

# --- Main Backgrounds ---
# Make the form background translucent to let the blur show through
FormBackgroundColor="#40000000"
BackgroundColor="#000000"
DimBackgroundColor="#000000"

# --- Input Fields ---
# Translucent black so it adapts to the wallpaper color
LoginFieldBackgroundColor="#40000000"
PasswordFieldBackgroundColor="#40000000"
LoginFieldTextColor="#ffffff"
PasswordFieldTextColor="#ffffff"

# --- Icons & Primary Accents ---
AccentColor="#ffffff"
UserIconColor="#ffffff"
PasswordIconColor="#ffffff"

# --- System Buttons ---
SystemButtonsIconsColor="#ffffff"
SessionButtonTextColor="#ffffff"
VirtualKeyboardButtonTextColor="#ffffff"

# --- Login Button ---
LoginButtonTextColor="#ffffff"
LoginButtonBackgroundColor="#60000000"
OverrideLoginButtonTextColor="#ffffff"

# --- Dropdown Menus (Session/Keyboard Selection) ---
DropdownTextColor="#ffffff"
DropdownBackgroundColor="#60000000"
DropdownSelectedBackgroundColor="#80000000"

# --- Highlight Colors (When selecting text) ---
HighlightTextColor="#000000"
HighlightBackgroundColor="#ffffff"
HighlightBorderColor="transparent"

# --- Hover States ---
HoverUserIconColor="#dddddd"
HoverPasswordIconColor="#dddddd"
HoverSystemButtonsIconsColor="#dddddd"
HoverSessionButtonTextColor="#dddddd"
HoverVirtualKeyboardButtonTextColor="#dddddd"

# --- Misc UI Elements ---
PlaceholderTextColor="#bbbbbb"
WarningColor="#ff5555"


####################################################################
# Form & Blur Settings
####################################################################

PartialBlur="true"
FullBlur=""
BlurMax="48"
Blur="1.05"

HaveFormBackground="false"
FormPosition="left"


####################################################################
# Virtual Keyboard
####################################################################

# Where the on-screen keyboard appears.
VirtualKeyboardPosition="left"


####################################################################
# Interface Behavior
####################################################################

HideVirtualKeyboard="false"
ForceHideVirtualKeyboardButton="false"

HideSystemButtons="false"
ForceHideSystemButtons="false"

HideLoginButton="false"

ForceLastUser="true"

PasswordFocus="true"
ForcePasswordFocus="true"

HideCompletePassword="true"
ForceHideCompletePassword="true"

AllowEmptyPassword="false"
AllowUppercaseLettersInUsernames="false"
AllowBadUsernames="false"
BypassSystemButtonsChecks="false"

RightToLeftLayout="false"
ForceRightToLeft="false"


####################################################################
# Translations & Custom Text
####################################################################

TranslatePlaceholderUsername=""
TranslatePlaceholderPassword=""
TranslateShowPassword=""
TranslateLogin=""
TranslateLoginFailedWarning=""
TranslateCapslockWarning=""
TranslateSession=""
TranslateSessionSelection=""
TranslateSuspend=""
TranslateHibernate=""
TranslateReboot=""
TranslateShutdown=""
TranslateVirtualKeyboardButton=""
TranslateVirtualKeyboardButtonOn=""
TranslateVirtualKeyboardButtonOff=""
